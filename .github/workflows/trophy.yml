name: Update GitHub Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Trophies
        uses: ryo-ma/github-profile-trophy@master
        env:
          GITHUB_TOKEN: ${{ secrets.TROPHY_TOKEN }}
        with:
          username: gaurika-analyst
          theme: radical
          no-frame: true
          no-bg: true
          column: 7
          out-path: profile-trophy.svg
      - name: Commit Trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update GitHub trophies"
          git push
