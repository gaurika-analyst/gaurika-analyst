name: Update GitHub Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Generate Trophies SVG
        env:
          GITHUB_TOKEN_1: ${{ secrets.TROPHY_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy
          cd /tmp/trophy
          deno eval "
            import { Card } from './src/card.ts';
            import { getUserInfo } from './src/user_info.ts';
            import { COLORS } from './src/theme.ts';
            const userInfo = await getUserInfo('gaurika-analyst');
            const card = new Card([], {
              theme: COLORS['radical'],
              noFrame: true,
              noBg: true,
              column: 7,
              row: 3,
              marginWidth: 4,
              marginHeight: 0,
            });
            const svg = card.render(userInfo);
            await Deno.writeTextFile('$GITHUB_WORKSPACE/profile-trophy.svg', svg);
          "
      - name: Commit Trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update GitHub trophies"
          git push
